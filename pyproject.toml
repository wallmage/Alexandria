[project]
name = "alexandria-research-skill"
version = "3.2.3"
description = "Source-backed research reports with validated PDF production"
requires-python = ">=3.10"
dependencies = [
  "Markdown==3.10.2",
  "WeasyPrint==69.0",
  "pypdf==6.14.2",
  "jsonschema==4.25.1",
  "pypdfium2==5.12.1",
  "Pillow==12.3.0",
]

[project.optional-dependencies]
dev = ["ruff==0.14.14"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "EXE", "RUF", "SIM"]
ignore = ["ISC004", "RUF001", "RUF005", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"scripts/md_to_pdf.py" = ["E402"]
"tests/build_gated_fixtures.py" = ["E402"]
