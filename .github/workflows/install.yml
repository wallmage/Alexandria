name: Install

on:
  push:
    paths:
      - 'scripts/install*'
      - 'requirements.txt'
      - '.github/workflows/install.yml'
      - 'INSTALL.md'
  pull_request:
    paths:
      - 'scripts/install*'
      - 'requirements.txt'
      - '.github/workflows/install.yml'
      - 'INSTALL.md'

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Select an isolated runtime directory
        shell: pwsh
        run: '"ALEXANDRIA_RUNTIME_DIR=$env:RUNNER_TEMP/alexandria runtime" >> $env:GITHUB_ENV'
      - name: Install on macOS
        if: runner.os == 'macOS'
        run: sh scripts/install.sh
      - name: Install on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: '& .\scripts\install.ps1'
      - name: Verify the saved runtime in a fresh shell
        shell: pwsh
        run: |
          $runtime = Get-Content .runtime.json | ConvertFrom-Json
          $program = $runtime.command[0]
          $arguments = $runtime.command[1..($runtime.command.Count - 1)]
          & $program @arguments scripts/install_runtime.py --runtime $env:ALEXANDRIA_RUNTIME_DIR --verify-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Diagnose the Windows launcher layers
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          $r = $env:ALEXANDRIA_RUNTIME_DIR
          Write-Output "--- launcher via cmd /c"
          cmd /c "`"$r\bin\python.cmd`" scripts/alx.py --help" 2>&1 | Out-String | Write-Output
          Write-Output "exit=$LASTEXITCODE"
          Write-Output "--- launcher bytes"
          Format-Hex -Path "$r\bin\python.cmd" | Select-Object -First 4 | Out-String | Write-Output
          Write-Output "--- micromamba run from pwsh"
          & "$r\Library\bin\micromamba.exe" --no-rc run --prefix "$r\env" python scripts/alx.py --help 2>&1 | Out-String | Write-Output
          Write-Output "exit=$LASTEXITCODE"
          Write-Output "--- env python direct"
          & "$r\env\python.exe" scripts/alx.py --help 2>&1 | Out-String | Write-Output
          Write-Output "exit=$LASTEXITCODE"
          & "$r\env\python.exe" -c "import weasyprint, jsonschema, pypdf; print('direct imports ok')" 2>&1 | Out-String | Write-Output
          Write-Output "exit=$LASTEXITCODE"
          Write-Output "--- listing"
          Get-ChildItem "$r" | Out-String | Write-Output
          Get-ChildItem "$r\Library\bin" -Filter micromamba* | Out-String | Write-Output
      - name: Run alx through the one-path launcher SKILL.md uses
        shell: pwsh
        run: |
          $launcher = if ($IsWindows) { "$env:ALEXANDRIA_RUNTIME_DIR\bin\python.cmd" } else { "$env:ALEXANDRIA_RUNTIME_DIR/bin/python" }
          Get-Content $launcher
          & $launcher scripts/alx.py --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload installation log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: install-${{ matrix.os }}
          path: ${{ runner.temp }}/alexandria runtime/install.log
          retention-days: 1
