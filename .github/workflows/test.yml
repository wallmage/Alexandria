name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk
          python -m pip install -r requirements.txt
          python -m pip install pip-audit

      - name: Audit Python dependencies
        if: matrix.python-version == '3.12'
        run: python -m pip_audit -r requirements.txt --vulnerability-service osv

      - name: Run unit tests
        run: python -m unittest discover -v

      - name: Compile scripts
        run: python -m py_compile scripts/*.py

      - name: Validate evidence ledger
        run: python scripts/validate_ledger.py tests/fixtures/evidence-ledger.json

      - name: Render and validate all templates in every supported language
        if: matrix.python-version == '3.12'
        run: python tests/ci_render_matrix.py /tmp/alexandria-ci

      - name: Verify live production source transport
        if: matrix.python-version == '3.12'
        run: |
          python -c "from scripts.source_fidelity import default_fetcher; result = default_fetcher('https://example.com/'); assert 'Example Domain' in result.text"

      - name: Rasterize all sample pages
        if: matrix.python-version == '3.12'
        run: |
          python scripts/render_pdf_pages.py \
            /tmp/alexandria-ci/pdfs/zh-CN-executive.pdf \
            /tmp/alexandria-pages \
            --dpi 96
          test "$(find /tmp/alexandria-pages -name 'page-*.png' | wc -l)" -ge 3
