name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            fonts-noto-cjk ghostscript mupdf-tools poppler-utils qpdf
          python -m pip install -r requirements.txt
          python -m pip install pip-audit

      - name: Audit Python dependencies
        if: matrix.python-version == '3.12'
        run: python -m pip_audit -r requirements.txt --vulnerability-service osv

      - name: Run unit tests
        run: python -m unittest discover -v

      - name: Compile scripts
        run: python -m py_compile scripts/*.py

      - name: Validate evidence ledger
        run: python scripts/validate_ledger.py tests/fixtures/evidence-ledger.json

      - name: Render and validate all templates in every supported language
        if: matrix.python-version == '3.12'
        run: python tests/ci_render_matrix.py /tmp/alexandria-ci

      - name: Validate PDF/A conformance and PDF structure
        if: matrix.python-version == '3.12'
        run: |
          docker run --rm \
            -v /tmp/alexandria-ci/pdfs:/data:ro \
            verapdf/cli:v1.30.2 \
            --format text --recurse /data
          find /tmp/alexandria-ci/pdfs -name '*.pdf' -print0 |
            xargs -0 -n1 qpdf --check

      - name: Cross-render every language and template
        if: matrix.python-version == '3.12'
        run: |
          python scripts/pdf_compatibility.py \
            /tmp/alexandria-ci/pdfs \
            /tmp/alexandria-renderers \
            --backends pdfium,poppler,mupdf,ghostscript

      - name: Publish the PDF compatibility matrix
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: alexandria-pdf-matrix
          path: /tmp/alexandria-ci/pdfs
          retention-days: 1

      - name: Verify live production source transport
        if: matrix.python-version == '3.12'
        run: |
          python -c "from scripts.source_fidelity import default_fetcher; result = default_fetcher('https://example.com/'); assert 'Example Domain' in result.text"

  macos-pdfkit:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pypdfium2==5.12.1 Pillow==12.3.0
      - uses: actions/download-artifact@v4
        with:
          name: alexandria-pdf-matrix
          path: /tmp/alexandria-pdfs
      - name: Open every PDF with macOS PDFKit
        run: |
          python scripts/pdf_compatibility.py \
            /tmp/alexandria-pdfs \
            /tmp/alexandria-macos-renderers \
            --backends pdfium,pdfkit

  windows-pdf:
    needs: test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pypdfium2==5.12.1 Pillow==12.3.0
      - run: choco install ghostscript --yes --no-progress
      - uses: actions/download-artifact@v4
        with:
          name: alexandria-pdf-matrix
          path: D:\alexandria-pdfs
      - name: Open every PDF on Windows
        run: |
          python scripts/pdf_compatibility.py `
            D:\alexandria-pdfs `
            D:\alexandria-windows-renderers `
            --backends pdfium,ghostscript
