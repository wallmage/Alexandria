name: Install

on:
  push:
    paths:
      - 'scripts/install*'
      - 'requirements.txt'
      - '.github/workflows/install.yml'
      - 'INSTALL.md'
  pull_request:
    paths:
      - 'scripts/install*'
      - 'requirements.txt'
      - '.github/workflows/install.yml'
      - 'INSTALL.md'

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Select an isolated runtime directory
        shell: pwsh
        run: '"ALEXANDRIA_RUNTIME_DIR=$env:RUNNER_TEMP/alexandria runtime" >> $env:GITHUB_ENV'
      - name: Install on macOS
        if: runner.os == 'macOS'
        run: sh scripts/install.sh
      - name: Install on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: '& .\scripts\install.ps1'
      - name: Verify the saved runtime in a fresh shell
        shell: pwsh
        run: |
          $runtime = Get-Content .runtime.json | ConvertFrom-Json
          $program = $runtime.command[0]
          $arguments = $runtime.command[1..($runtime.command.Count - 1)]
          & $program @arguments scripts/install_runtime.py --runtime $env:ALEXANDRIA_RUNTIME_DIR --verify-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Diagnose the Windows launcher layers
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          $r = $env:ALEXANDRIA_RUNTIME_DIR
          $b = $r -replace '/', '\'
          $m = "$b\Library\bin\micromamba.exe"
          Write-Output "--- 1 micromamba backslash prefix, --help"
          & $m --no-rc run --prefix "$b\env" python scripts/alx.py --help 2>&1 | Out-String | Write-Output
          Write-Output "exit=$LASTEXITCODE"
          Write-Output "--- 2 micromamba backslash prefix, no --help"
          & $m --no-rc run --prefix "$b\env" python -c "import weasyprint; print('2 ok')" 2>&1 | Out-String | Write-Output
          Write-Output "exit=$LASTEXITCODE"
          Write-Output "--- 3 micromamba forward-slash prefix, no --help"
          & $m --no-rc run --prefix "$r\env" python -c "print('3 ok')" 2>&1 | Out-String | Write-Output
          Write-Output "exit=$LASTEXITCODE"
          Write-Output "--- 4 launcher via backslash path, no --help"
          & "$b\bin\python.cmd" -c "import weasyprint; print('4 ok')" 2>&1 | Out-String | Write-Output
          Write-Output "exit=$LASTEXITCODE"
          Write-Output "--- 5 launcher via forward-slash path, --help"
          & "$r\bin\python.cmd" scripts/alx.py --help 2>&1 | Out-String | Write-Output
          Write-Output "exit=$LASTEXITCODE"
          Write-Output "--- 6 micromamba run -- separator, --help"
          & $m --no-rc run --prefix "$b\env" -- python scripts/alx.py --help 2>&1 | Out-String | Write-Output
          Write-Output "exit=$LASTEXITCODE"
      - name: Run alx through the one-path launcher SKILL.md uses
        shell: pwsh
        run: |
          $launcher = if ($IsWindows) { "$env:ALEXANDRIA_RUNTIME_DIR\bin\python.cmd" } else { "$env:ALEXANDRIA_RUNTIME_DIR/bin/python" }
          Get-Content $launcher
          & $launcher -c "import weasyprint, jsonschema, pypdf; print('launcher ok')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload installation log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: install-${{ matrix.os }}
          path: ${{ runner.temp }}/alexandria runtime/install.log
          retention-days: 1
